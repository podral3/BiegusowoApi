info:
  name: Get a paginated list of minimal article data to display.
  type: http
  seq: 1
  tags:
    - Articles

http:
  method: GET
  url: "{{baseUrl}}/api/Articles"
  params:
    - name: beforePublishedAt
      value: ""
      type: query
      disabled: true
    - name: beforeArticleId
      value: ""
      type: query
      disabled: true
    - name: pageSize
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

